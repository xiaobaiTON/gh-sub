name: proxy-sub

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: proxy-sub
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache xray
        uses: actions/cache@v4
        with:
          path: xray
          key: xray-linux64-latest

      - name: Install xray
        run: |
          if [ ! -x xray/xray ]; then
            mkdir -p xray
            curl -fL --retry 3 -o xray.zip https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
            unzip -o xray.zip -d xray
            chmod +x xray/xray
          fi
          xray/xray version | head -1 || ./xray/xray version | head -1

      - name: Discover new sources
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python discover.py

      - name: Discover web sources
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_CX: ${{ secrets.GOOGLE_CX }}
        run: python discover_web.py

      - name: Scan and filter
        env:
          XRAY_BIN: xray/xray
        run: python scan.py --sources sources.txt --limit 1500 --workers 32 --keep 200 --out .

      - name: Commit results
        run: |
          git config user.name "proxy-sub-bot"
          git config user.email "proxy-sub-bot@users.noreply.github.com"
          git add nodes.txt sub.txt clash.yaml stats.json sources.auto.txt links.web.txt sources.web.txt
          git diff --cached --quiet || git commit -m "update $(date -u +%Y-%m-%dT%H:%MZ)"
          git push || true
