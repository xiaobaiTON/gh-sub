name: proxy-sub

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: proxy-sub
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache xray
        uses: actions/cache@v4
        with:
          path: xray
          key: xray-linux64-latest

      - name: Install xray
        run: |
          if [ ! -x xray/xray ]; then
            mkdir -p xray
            curl -fL --retry 3 -o xray.zip https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
            unzip -o xray.zip -d xray
            chmod +x xray/xray
          fi
          xray/xray version | head -1 || ./xray/xray version | head -1

      - name: Discover new sources
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python discover.py

      - name: Discover web sources
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_CX: ${{ secrets.GOOGLE_CX }}
        run: python discover_web.py

      - name: Scan, filter and validate
        env:
          XRAY_BIN: xray/xray
        run: python scan.py --sources sources.txt --limit 1500 --workers 6 --batch 10 --keep 40 --rounds 3 --max-latency 2000 --out .

      - name: Sanity check outputs
        run: |
          python - <<'PY'
          import json, re, sys
          text = open("clash.yaml", encoding="utf-8").read()
          head = text.split("proxy-groups:")[0]
          blocks = re.split(r"\n  - name: ", head)[1:]
          if not blocks:
              sys.exit("clash.yaml has no proxies")
          for b in blocks:
              for pat, label in ((r"^\s+type:\s*\S+$", "type"),
                                 (r"^\s+server:\s*\S+$", "server"),
                                 (r"^\s+port:\s*\d+\s*$", "port")):
                  if not re.search(pat, b, re.M):
                      sys.exit("proxy block missing " + label)
              for m in re.finditer(r"^\s+(uuid|password|cipher):\s*(.+)$", b, re.M):
                  v = m.group(2).strip()
                  if v in ('""', "''", "", "None"):
                      sys.exit("proxy block has empty " + m.group(1))
              for m in re.finditer(r"^\s+short-id:\s*(.+)$", b, re.M):
                  v = m.group(1).strip()
                  if not v.startswith('"'):
                      sys.exit("unquoted short-id: " + v)
                  v = v.strip('"')
                  if not re.fullmatch(r"[0-9a-f]{2,16}", v) or len(v) % 2:
                      sys.exit("invalid short-id: " + v)
          stats = json.load(open("stats.json", encoding="utf-8"))
          print("proxies", len(blocks), "published", stats.get("published"))
          PY

      - name: Commit results
        run: |
          git config user.name "proxy-sub-bot"
          git config user.email "proxy-sub-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "update $(date -u +%Y-%m-%dT%H:%MZ)"
          git push || true